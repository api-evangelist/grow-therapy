name: Grow Therapy
description: >-
  Grow Therapy is a mental-health platform that connects individuals with
  licensed therapists and prescribers, offering virtual and in-person talk
  therapy plus medication management in one insurance-integrated experience.
  The company operates a two-sided marketplace: a client-facing product for
  finding, booking, and paying for care (with insurance verification and an
  average session cost around $21 for covered clients) and a provider portal
  that gives clinicians scheduling, billing, telehealth, and practice-management
  tooling. Grow also partners with employers, physicians, and payors on B2B
  mental-health access. It was surfaced as a portfolio company of Menlo Ventures
  and added to the API Evangelist network; Grow Therapy publishes a public
  Statuspage but does not expose a public developer API, so this profile
  captures its company identity, operational transparency, and domain-security
  posture rather than API artifacts.
